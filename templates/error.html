{% extends "base.html" %}

{% block title %}错误 - {{ app_name }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div style="width: 80px; height: 80px; background: #fef2f2; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
    </div>
    <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">{{ status_code or 500 }}</h1>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">{{ detail or '出错了，请稍后重试' }}</p>
    <a href="/" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
