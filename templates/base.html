<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-dark: #4338ca;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --primary-glow: rgba(79, 70, 229, 0.15);
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --bg: #f0f4f8;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #dbeafe 100%);
            --card: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: rgba(226, 232, 240, 0.6);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.07), 0 4px 6px -4px rgba(0,0,0,0.04);
            --shadow-glow: 0 0 40px rgba(79, 70, 229, 0.08);
            --radius-sm: 0.5rem;
            --radius: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 背景装饰 ========== */
        .bg-decoration {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(79,70,229,0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }
        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124,58,237,0.06) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* ========== 导航栏 ========== */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .logo {
            font-size: 1.35rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary-gradient);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-text-fill-color: white;
            flex-shrink: 0;
        }
        .logo-icon svg { width: 18px; height: 18px; stroke: white; }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0.875rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            color: var(--primary);
            background: var(--primary-glow);
        }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-left: 0.5rem;
            padding-left: 0.75rem;
            border-left: 1px solid var(--border);
        }
        .username {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .btn:hover::after { transform: translateX(100%); }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--card-solid);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .btn-secondary:hover {
            background: #f8fafc;
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid #fecaca;
        }
        .btn-danger:hover { background: #fee2e2; }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover { background: rgba(0,0,0,0.04); color: var(--text); }
        .btn-sm { padding: 0.375rem 0.875rem; font-size: 0.8125rem; }
        .btn-lg { padding: 0.875rem 2rem; font-size: 1rem; border-radius: var(--radius-lg); }

        /* ========== 容器 ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow), var(--shadow-glow);
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
        }

        /* ========== 表单 ========== */
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            background: var(--card-solid);
            transition: all 0.2s ease;
            color: var(--text);
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: white;
        }
        .form-input-group {
            position: relative;
        }
        .form-input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .form-input.with-icon { padding-left: 2.75rem; }

        /* ========== 提示 ========== */
        .alert {
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 1px solid transparent;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-danger {
            background: var(--danger-light);
            color: #991b1b;
            border-color: #fecaca;
        }
        .alert-success {
            background: var(--success-light);
            color: #065f46;
            border-color: #a7f3d0;
        }
        .alert-warning {
            background: var(--warning-light);
            color: #92400e;
            border-color: #fde68a;
        }

        /* ========== 标签 ========== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge-primary { background: #e0e7ff; color: var(--primary-dark); }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-secondary { background: #f1f5f9; color: var(--text-secondary); }
        .badge-admin {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        /* ========== 表格 ========== */
        .table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .table th, .table td {
            text-align: left;
            padding: 0.875rem 1rem;
            font-size: 0.875rem;
        }
        .table th {
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.6875rem;
            letter-spacing: 0.08em;
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
        }
        .table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
        .table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
        .table td { border-bottom: 1px solid var(--border); }
        .table tr:hover td { background: #f8fafc; }
        .table tr:last-child td:first-child { border-radius: 0 0 0 var(--radius-sm); }
        .table tr:last-child td:last-child { border-radius: 0 0 var(--radius-sm) 0; }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state-icon {
            width: 64px;
            height: 64px;
            background: #f1f5f9;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .empty-state-icon svg { width: 28px; height: 28px; color: var(--text-muted); }
        .empty-state h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.875rem; color: var(--text-muted); }

        /* ========== 网格 ========== */
        .grid { display: grid; gap: 1.5rem; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        /* ========== 范围标签 ========== */
        .scope-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            background: #e0e7ff;
            color: var(--primary-dark);
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.375rem;
            margin-bottom: 0.375rem;
            border: 1px solid #c7d2fe;
        }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-solid);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            animation: scaleIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }
        .modal-title { font-size: 1.125rem; font-weight: 700; }
        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover { background: #e2e8f0; color: var(--text); }

        /* ========== 分隔线 ========== */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 1.5rem 0;
        }
        .divider-text {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.8125rem;
            margin: 1.25rem 0;
        }
        .divider-text::before, .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ========== 链接 ========== */
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .link:hover { color: var(--primary-dark); text-decoration: underline; }

        /* ========== 工具类 ========== */
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .w-full { width: 100%; }
        .max-w-sm { max-width: 400px; }
        .max-w-md { max-width: 480px; }
        .max-w-lg { max-width: 560px; }
        .max-w-xl { max-width: 640px; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .text-center { text-align: center; }
        .relative { position: relative; }
        .z-10 { z-index: 10; }
        .hidden { display: none; }

        /* ========== 页面进入动画 ========== */
        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .fade-in-delay-3 { animation-delay: 0.3s; opacity: 0; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
            .navbar-inner { height: 56px; }
            .nav-links a { padding: 0.375rem 0.5rem; font-size: 0.8125rem; }
            .nav-user { display: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
    <meta name="unisso-root" content="{{ root_path }}">
</head>
<body>
    <div class="bg-decoration"></div>

    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{{ root_path }}" class="logo">
                <span class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </span>
                {{ app_name }}
            </a>
            <div class="nav-links">
                {% if user %}
                    <a href="{{ root_path }}consents">我的授权</a>
                    <a href="{{ root_path }}profile">个人中心</a>
                    {% if user.is_admin %}
                        <a href="{{ root_path }}admin/apps">应用管理</a>
                        <a href="{{ root_path }}admin/users">用户管理</a>
                    {% endif %}
                    <div class="nav-user">
                        <div class="user-avatar">{{ (user.full_name or user.email)[0]|upper }}</div>
                        <span class="username">{{ user.email.split('@')[0] }}</span>
                        <form action="{{ root_path }}api/auth/logout" method="post" style="display:inline">
                            <button type="submit" class="btn btn-ghost btn-sm">退出</button>
                        </form>
                    </div>
                {% else %}
                    <a href="{{ root_path }}login">登录</a>
                    <a href="{{ root_path }}register">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ root_path }}static/browser-security.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
