{% extends "base.html" %}

{% block title %}登录 - {{ app_name }}{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.5rem; font-weight: 700;">欢迎回来</h2>
            <p class="text-secondary text-sm mt-2">使用中山大学邮箱登录 UniSSO</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">
            {% if error == 'invalid_credentials' %}
                邮箱或密码错误
            {% else %}
                {{ error }}
            {% endif %}
        </div>
        {% endif %}

        <form action="{{ root_path }}api/auth/login" method="post">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label class="form-label">中大邮箱</label>
                <input type="email" name="email" class="form-input" required
                       placeholder="xxx@mail2.sysu.edu.cn" autofocus
                       pattern="[a-zA-Z0-9._%+-]+@mail\d*\.sysu\.edu\.cn"
                       title="必须使用中山大学邮箱: *.mail*.sysu.edu.cn">
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-input" required
                       placeholder="请输入密码">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                登录
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
            <p class="text-sm text-secondary">
                还没有账号？
                <a href="{{ root_path }}register" style="color: var(--primary); text-decoration: none; font-weight: 500;">立即注册</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
