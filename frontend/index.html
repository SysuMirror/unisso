<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>统一身份认证</title>
  </head>
  <body>
    <div id="app">
      <div class="boot"><span class="boot-spin"></span><span class="boot-text">统一身份认证</span></div>
    </div>
    <style>
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;
            align-items:center;justify-content:center;background:#fbfbfa;
            color:#8a8a86;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot-spin{width:26px;height:26px;border-radius:50%;
                 border:2.5px solid #e3e3df;border-top-color:#171717;
                 animation:boot-rot .8s linear infinite}
      @keyframes boot-rot{to{transform:rotate(360deg)}}
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
